date: "2026-04"

abstract: |
  Multi-agent LLM debate frameworks improve answer quality but lack convergence
  guarantees. We introduce a marker-based refinement protocol where agents
  annotate disagreement and ambiguity inline within a shared document, and a
  staleness rule provides bounded termination. Reference implementation: ~200
  lines of bash with adapters for Claude and Codex CLIs. Pilot evaluation
  across 47 retrospective bouncer runs shows 82.5% convergence under default
  parameters. The protocol is published as a CC0 specification suitable for
  cross-tool interoperability.

